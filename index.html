<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>EnglishRead 精读</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="中文母语者的英文逐句精读知识库">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="./docsify/vue.css">
  <style>
    :root {
      --theme-color: #4A90D9;
    }
    .sidebar .app-name {
      text-align: center;
    }
    .markdown-section h1 {
      border-bottom: 2px solid var(--theme-color);
      padding-bottom: 0.3em;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: #f8f9fa;
    }
    /* 可折叠侧边栏 */
    .sidebar li > ul {
      display: none;
      margin-left: 10px;
    }
    .sidebar li.open > ul {
      display: block;
    }
    .sidebar li > a {
      cursor: pointer;
    }
    .sidebar li > a::before {
      content: '▶';
      display: inline-block;
      width: 12px;
      font-size: 8px;
      transition: transform 0.2s;
    }
    .sidebar li.open > a::before {
      transform: rotate(90deg);
    }
    /* 首页不显示箭头 */
    .sidebar li:first-child > a::before {
      content: '';
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'EnglishRead 精读',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: false,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索精读文章...',
        noData: '没有找到结果',
        depth: 3,
      },
      auto2top: true,
      relativePath: true,
    }
  </script>
  <script src="./docsify/docsify.min.js"></script>
  <script src="./docsify/search.min.js"></script>
  <script>
    // 可折叠侧边栏
    document.addEventListener('click', function(e) {
      var target = e.target;
      // 找到最近的 li
      var li = target.closest('li');
      if (!li) return;
      
      // 检查是否有子菜单
      var ul = li.querySelector(':scope > ul');
      if (!ul) return;
      
      // 阻止默认行为（如果点击的是链接）
      if (target.tagName === 'A') {
        e.preventDefault();
      }
      
      li.classList.toggle('open');
    });
  </script>
</body>
</html>
