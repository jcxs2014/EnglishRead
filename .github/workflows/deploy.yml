# GitHub Actions: 构建 + Wrangler 部署到 Cloudflare Workers
# 用途：把 EnglishRead 的"构建"从 Cloudflare Git 集成（CF 构建机跑 build.sh）移到 GitHub Actions，
#       部署仍用 `wrangler deploy` 推回 englishread Worker（线上 englishread.jcxs2014.workers.dev）。
# 参考：web-build-docs/englishread-build.md 「把构建迁到 GitHub Actions（可选）→ 方案 A」。

name: Build & Deploy EnglishRead

on:
  push:
    branches: [main]          # 部署分支，按仓库实际改（如 master）
  workflow_dispatch:          # 允许手动触发

concurrency:
  group: deploy-englishread
  cancel-in-progress: true    # 避免重叠推送导致重复部署

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Quartz 依赖在 site/ 下；build.sh 内部会 npm install，这里仅启用缓存加速
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build (Quartz + slim contentIndex)
        run: bash build.sh
        env:
          # 关键：18000+ 篇笔记时 Quartz 把全部 worker 结果反序列化进主进程，
          # 默认 2GB 堆会 OOM，必须上调到 6GB（build.sh 内已设 8adfc5bf，此处冗余但无害）。
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 本身不吃这块内存，但环境变量透传无副作用
          NODE_OPTIONS: "--max-old-space-size=6144"
