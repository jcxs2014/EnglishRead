<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- ============================================
       EnglishRead 图标系统
       风格：1.5px stroke / round caps / 几何简笔
       viewBox: 24x24
       ============================================ -->

  <!-- 来源图标（5个出版方） -->
  <symbol id="icon-source-economist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="1"/>
    <line x1="3" y1="9" x2="21" y2="9"/>
    <line x1="3" y1="13" x2="21" y2="13"/>
    <line x1="3" y1="17" x2="21" y2="17"/>
    <line x1="7" y1="5" x2="7" y2="19"/>
  </symbol>

  <symbol id="icon-source-parisreview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h7a3 3 0 0 1 3 3v13"/>
    <path d="M19 4h-7a3 3 0 0 0-3 3v13"/>
    <path d="M12 4v13"/>
  </symbol>

  <symbol id="icon-source-brainpickings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5.7 3 3 0 0 0 1 5.8 3 3 0 0 0 4 .5 3 3 0 0 0 4-.5 3 3 0 0 0 1-5.8 3 3 0 0 0-2-5.7V7a3 3 0 0 0-3-3z"/>
    <path d="M12 4v16"/>
    <path d="M9 9h.01"/>
    <path d="M15 9h.01"/>
    <path d="M9 13h.01"/>
    <path d="M15 13h.01"/>
    <path d="M9 17h.01"/>
    <path d="M15 17h.01"/>
  </symbol>

  <symbol id="icon-source-granta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h11a3 3 0 0 1 3 3v13"/>
    <path d="M19 4v13a3 3 0 0 1-3 3H5"/>
    <path d="M5 4v13"/>
    <path d="M9 8h6"/>
    <path d="M9 12h6"/>
  </symbol>

  <symbol id="icon-source-lithub" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="7" height="3" rx="0.5"/>
    <rect x="3" y="10" width="7" height="3" rx="0.5"/>
    <rect x="3" y="16" width="7" height="3" rx="0.5"/>
    <line x1="13" y1="5.5" x2="20" y2="5.5"/>
    <line x1="13" y1="11.5" x2="20" y2="11.5"/>
    <line x1="13" y1="17.5" x2="20" y2="17.5"/>
  </symbol>

  <!-- 阅读状态图标 -->
  <symbol id="icon-status-unread" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
  </symbol>

  <symbol id="icon-status-reading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 3v18" fill="currentColor" stroke="none"/>
    <path d="M12 3a9 9 0 0 1 9 9" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-status-read" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/>
    <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2"/>
  </symbol>

  <!-- 精读章节图标 -->
  <symbol id="icon-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>

  <symbol id="icon-paragraph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 4v16"/>
    <path d="M10 4v16"/>
    <path d="M14 4h4v16h-4"/>
    <path d="M14 4v6"/>
  </symbol>

  <symbol id="icon-vocab" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <text x="3" y="11" font-family="serif" font-size="9" font-weight="700" fill="currentColor" stroke="none">A</text>
    <text x="13" y="20" font-family="serif" font-size="11" font-weight="700" fill="currentColor" stroke="none">a</text>
  </symbol>

  <symbol id="icon-sentence" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h6"/>
    <path d="M7 4l3 3-3 3"/>
    <path d="M14 14h6"/>
    <path d="M17 11l3 3-3 3"/>
  </symbol>

  <symbol id="icon-summary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="4" width="14" height="17" rx="1"/>
    <line x1="9" y1="9" x2="15" y2="9"/>
    <line x1="9" y1="13" x2="15" y2="13"/>
    <line x1="9" y1="17" x2="13" y2="17"/>
  </symbol>

  <symbol id="icon-migratable" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
  </symbol>

  <!-- 通用 UI 图标 -->
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12l9-9 9 9"/>
    <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
  </symbol>

  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/>
    <line x1="21" y1="21" x2="16.5" y2="16.5"/>
  </symbol>

  <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="20" x2="12" y2="4"/>
    <polyline points="5 11 12 4 19 11"/>
  </symbol>

  <symbol id="icon-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
  </symbol>

  <symbol id="icon-quote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h2c0 4-2 5-3 5z"/>
    <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h2c0 4-2 5-3 5z"/>
  </symbol>

  <symbol id="icon-translate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8h7"/>
    <path d="M9 4v4"/>
    <path d="M5 12c0 4 3 7 6 8"/>
    <path d="M12 12c0 4-3 7-7 8"/>
    <line x1="13" y1="21" x2="21" y2="11"/>
    <path d="M17 5l4 6"/>
    <path d="M21 5l-4 6"/>
  </symbol>

  <symbol id="icon-reading-time" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <polyline points="12 7 12 12 16 14"/>
  </symbol>
</svg>